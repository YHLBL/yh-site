<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        
        /* 动态背景 */
        body.bg-texture { background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); }
        body.bg-marble { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%); }
        body.bg-blue { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); }
        body.bg-purple { background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%); }
        body.bg-green { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); }
        body.bg-orange { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); }
        body.bg-pink { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 100%); }
        body.bg-dark { background: linear-gradient(135deg, #263238 0%, #37474f 100%); }
        body.bg-ocean { background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); }
        body.bg-sunset { background: linear-gradient(135deg, #ffccbc 0%, #ffab91 100%); }
        body.bg-forest { background: linear-gradient(135deg, #dcedc8 0%, #c5e1a5 100%); }
        body.bg-coffee { background: linear-gradient(135deg, #efebe9 0%, #d7ccc8 100%); }
        body.bg-midnight { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); }
        body.bg-candy { background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 50%, #bbdefb 100%); }
        body.bg-cyber { background: linear-gradient(135deg, #00bcd4 0%, #009688 100%); }
        body.bg-gold { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); }
        body.bg-rose { background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%); }
        body.bg-sky { background: linear-gradient(135deg, #e3f2fd 0%, #90caf9 100%); }
        body.bg-mint { background: linear-gradient(135deg, #e0f2f1 0%, #80cbc4 100%); }
        body.bg-lavender { background: linear-gradient(135deg, #f3e5f5 0%, #ce93d8 100%); }
        body.bg-coral { background: linear-gradient(135deg, #ffccbc 0%, #ff8a65 100%); }
        
        /* 顶部栏 */
        .header {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #667eea;
            background: #f0f0f0;
        }
        .header-title-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            line-height: 1.3;
        }
        .header-subtitle {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .header-subtitle .weather-icon {
            font-size: 14px;
        }
        .header-menu {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
        
        /* 主内容区 */
        .main-content {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 功能卡片网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tool-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
        }
        .tool-card:active {
            transform: scale(0.96);
        }
        .tool-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .tool-name {
            font-size: 12px;
            color: #333;
            font-weight: 500;
        }
        
        /* 快捷功能区 */
        .quick-section {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quick-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e8e8e8;
            border-radius: 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 90px;
            background: #fafafa;
        }
        .quick-input:focus {
            border-color: #667eea;
            background: #fff;
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 8px 14px;
            background: #f5f5f5;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: #667eea;
            color: #fff;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item.active .nav-icon {
            color: #667eea;
        }
        .nav-item.active .nav-text {
            color: #667eea;
            font-weight: 600;
        }
        .nav-icon {
            font-size: 22px;
            color: #999;
            margin-bottom: 3px;
        }
        .nav-text {
            font-size: 11px;
            color: #999;
        }
        
        /* 个人资料页面 */
        .profile-page {
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .profile-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.3);
            margin: 20px auto 15px;
            cursor: pointer;
            background: #fff;
        }
        .profile-name {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        .profile-id {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 5px;
        }
        
        .profile-section {
            background: #fff;
            border-radius: 16px;
            margin: 15px;
            padding: 20px;
        }
        .profile-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .profile-item:last-child {
            border-bottom: none;
        }
        .profile-item-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 15px;
            background: #f5f5f5;
        }
        .profile-item-content {
            flex: 1;
        }
        .profile-item-label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .profile-item-value {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }
        .profile-item-arrow {
            color: #ccc;
            font-size: 14px;
        }
        
        /* 背景选择弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }
        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        /* 背景网格 */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .bg-option {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .bg-option:hover {
            transform: scale(1.05);
        }
        .bg-option.selected {
            border-color: #667eea;
        }
        .bg-option.selected::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: #667eea;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .bg-option-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 5px;
            font-size: 10px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            border-radius: 0 0 9px 9px;
        }
        
        /* 输入框样式 */
        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }
        .input-field:focus {
            border-color: #667eea;
        }
        
        /* 天气选择器样式 */
        .weather-search {
            margin-bottom: 15px;
        }
        .weather-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .weather-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f5f5f5;
            color: #666;
        }
        .weather-tab.active {
            background: #667eea;
            color: #fff;
        }
        .weather-content {
            max-height: 300px;
            overflow-y: auto;
        }
        .weather-section {
            margin-bottom: 15px;
        }
        .weather-section-title {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
            padding-left: 5px;
        }
        .weather-city-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .weather-city-item {
            padding: 10px 5px;
            background: #f8f8f8;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .weather-city-item:hover {
            background: #667eea;
            color: #fff;
        }
        .weather-city-item.selected {
            background: #667eea;
            color: #fff;
        }
        .weather-province-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .weather-province-item {
            padding: 12px 15px;
            background: #f8f8f8;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .weather-province-item:hover {
            background: #667eea;
            color: #fff;
        }
        .weather-district-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        
        /* 隐藏的文件输入 */
        #avatarInput {
            display: none;
        }
        
        /* 页面容器 */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="homePage" class="page active">
        <div class="header">
            <img src="" alt="头像" class="header-avatar" id="headerAvatar" onclick="openProfile()">
            <div class="header-title-area">
                <div class="header-title" id="headerTitle">AI 全能工作台</div>
                <div class="header-subtitle" id="headerSubtitle" onclick="openWeatherSelector()">
                    <span id="dateWeather">加载中...</span>
                </div>
            </div>
            <div class="header-menu" onclick="showMenu()">⋮</div>
        </div>
        
        <div class="main-content">
            <!-- 功能网格 -->
            <div class="tools-grid">
                <div class="tool-card" onclick="openTool('chat')">
                    <div class="tool-icon">💬</div>
                    <div class="tool-name">AI对话</div>
                </div>
                <div class="tool-card" onclick="openTool('write')">
                    <div class="tool-icon">✍️</div>
                    <div class="tool-name">AI写作</div>
                </div>
                <div class="tool-card" onclick="openTool('translate')">
                    <div class="tool-icon">🌐</div>
                    <div class="tool-name">AI翻译</div>
                </div>
                <div class="tool-card" onclick="openTool('summary')">
                    <div class="tool-icon">📝</div>
                    <div class="tool-name">AI总结</div>
                </div>
                <div class="tool-card" onclick="openTool('code')">
                    <div class="tool-icon">💻</div>
                    <div class="tool-name">AI编程</div>
                </div>
                <div class="tool-card" onclick="openTool('brainstorm')">
                    <div class="tool-icon">💡</div>
                    <div class="tool-name">头脑风暴</div>
                </div>
                <div class="tool-card" onclick="openTool('image')">
                    <div class="tool-icon">🎨</div>
                    <div class="tool-name">AI绘画</div>
                </div>
                <div class="tool-card" onclick="openTool('more')">
                    <div class="tool-icon">⋮</div>
                    <div class="tool-name">更多</div>
                </div>
            </div>
            
            <!-- 快捷输入区 -->
            <div class="quick-section">
                <div class="section-title">⚡ 快速提问</div>
                <textarea class="quick-input" id="quickInput" placeholder="输入任何问题，AI为你解答..."></textarea>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="setQuick('帮我写')">帮我写</button>
                    <button class="quick-btn" onclick="setQuick('翻译')">翻译</button>
                    <button class="quick-btn" onclick="setQuick('解释')">解释</button>
                    <button class="quick-btn" onclick="setQuick('建议')">建议</button>
                </div>
                <button class="action-btn" onclick="quickAsk()">立即提问</button>
            </div>
        </div>
    </div>
    
    <!-- 个人资料页面 -->
    <div id="profilePage" class="page profile-page">
        <div class="profile-header">
            <button class="profile-back" onclick="goHome()">← 返回</button>
            <img src="" alt="头像" class="profile-avatar-large" id="profileAvatar" onclick="selectAvatar()">
            <div class="profile-name" id="profileName">用户</div>
            <div class="profile-id" id="profileId">ID: loading...</div>
        </div>
        
        <div class="profile-section">
            <div class="profile-item" onclick="editNickname()">
                <div class="profile-item-icon">👤</div>
                <div class="profile-item-content">
                    <div class="profile-item-label">昵称</div>
                    <div class="profile-item-value" id="nicknameValue">点击修改</div>
                </div>
                <div class="profile-item-arrow">›</div>
            </div>
            <div class="profile-item" onclick="selectAvatar()">
                <div class="profile-item-icon">🖼️</div>
                <div class="profile-item-content">
                    <div class="profile-item-label">头像</div>
                    <div class="profile-item-value">点击更换</div>
                </div>
                <div class="profile-item-arrow">›</div>
            </div>
            <div class="profile-item" onclick="openBgSelector()">
                <div class="profile-item-icon">🎨</div>
                <div class="profile-item-content">
                    <div class="profile-item-label">背景</div>
                    <div class="profile-item-value" id="bgValue">点击选择</div>
                </div>
                <div class="profile-item-arrow">›</div>
            </div>
            <div class="profile-item">
                <div class="profile-item-icon">🔢</div>
                <div class="profile-item-content">
                    <div class="profile-item-label">用户ID</div>
                    <div class="profile-item-value" id="userIdDisplay">用于数据存储识别</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 背景选择弹窗 -->
    <div class="modal-overlay" id="bgModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">选择背景</div>
                <div class="modal-close" onclick="closeBgModal()">×</div>
            </div>
            <div class="modal-body">
                <div class="bg-grid" id="bgGrid"></div>
            </div>
        </div>
    </div>
    
    <!-- 昵称编辑弹窗 -->
    <div class="modal-overlay" id="nicknameModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">修改昵称</div>
                <div class="modal-close" onclick="closeNicknameModal()">×</div>
            </div>
            <div class="modal-body">
                <input type="text" class="input-field" id="nicknameInput" placeholder="输入新昵称" maxlength="10">
                <button class="action-btn" onclick="saveNickname()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- 天气地区选择弹窗 -->
    <div class="modal-overlay" id="weatherModal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <div class="modal-title">选择地区</div>
                <div class="modal-close" onclick="closeWeatherModal()">×</div>
            </div>
            <div class="modal-body">
                <div class="weather-search">
                    <input type="text" class="input-field" id="citySearch" placeholder="输入城市名称搜索" oninput="searchCity()">
                </div>
                <div class="weather-tabs">
                    <div class="weather-tab active" onclick="switchWeatherTab('hot')">热门城市</div>
                    <div class="weather-tab" onclick="switchWeatherTab('province')">按省份</div>
                </div>
                <div class="weather-content" id="weatherContent">
                    <!-- 动态加载城市列表 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 隐藏的文件输入 -->
    <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarSelect(event)">
    
    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <div class="nav-icon">🏠</div>
            <div class="nav-text">首页</div>
        </div>
        <div class="nav-item" onclick="switchTab('tools')">
            <div class="nav-icon">🛠️</div>
            <div class="nav-text">工具</div>
        </div>
        <div class="nav-item" onclick="switchTab('history')">
            <div class="nav-icon">📚</div>
            <div class="nav-text">历史</div>
        </div>
        <div class="nav-item" onclick="switchTab('settings')">
            <div class="nav-icon">⚙️</div>
            <div class="nav-text">设置</div>
        </div>
    </div>

    <script>
        // ==================== 数据存储 ====================
        // 生成唯一ID
        function generateId() {
            return 'user_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }
        
        // 初始化用户数据
        let userData = JSON.parse(localStorage.getItem('aiWorkUserData')) || {
            id: generateId(),
            nickname: '',
            avatar: '',
            background: 'texture',
            weatherCity: '北京',
            weatherTemp: 22,
            weatherIcon: '🌤️'
        };

        function handleAvatarSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 检查文件大小（最大 2MB）
            if (file.size > 2 * 1024 * 1024) {
                alert('图片大小不能超过 2MB');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // 压缩图片
                    const canvas = document.createElement('canvas');
                    const size = 200; // 头像尺寸
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    // 等比例缩放并裁剪为圆形
                    const minSize = Math.min(img.width, img.height);
                    const sx = (img.width - minSize) / 2;
                    const sy = (img.height - minSize) / 2;
                    
                    ctx.beginPath();
                    ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    
                    ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, size, size);
                    
                    userData.avatar = canvas.toDataURL('image/jpeg', 0.8);
                    saveUserData();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 更新日期天气显示
        function updateDateWeather() {

            const date = now.getDate();
            const weekDay = weekDays[now.getDay()];
            
            const city = userData.weatherCity || '北京';
            const temp = userData.weatherTemp || '--';
            const icon = userData.weatherIcon || '🌤️';

        }

        // 获取天气数据（使用 wttr.in 免费 API）
        async function fetchWeather(city) {
            try {
                const response = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=%C|%t`, { mode: 'cors' });
                if (!response.ok) throw new Error('Weather fetch failed');
                const data = await response.text();
                const [condition, temp] = data.split('|');
                
                // 天气图标映射
                const iconMap = {
                    'Sunny': '☀️', 'Clear': '☀️', 'sunny': '☀️', 'clear': '☀️',
                    'Partly cloudy': '🌤️', 'partly cloudy': '🌤️', 'Cloudy': '☁️', 'cloudy': '☁️',
                    'Overcast': '☁️', 'overcast': '☁️',
                    'Rain': '🌧️', 'rain': '🌧️', 'Light rain': '🌦️', 'light rain': '🌦️',
                    'Heavy rain': '⛈️', 'heavy rain': '⛈️',
                    'Snow': '❄️', 'snow': '❄️',
                    'Thunder': '⛈️', 'thunder': '⛈️',
                    'Fog': '🌫️', 'fog': '🌫️', 'Mist': '🌫️', 'mist': '🌫️'
                };
                
                let weatherIcon = '🌤️';
                for (const [key, icon] of Object.entries(iconMap)) {
                    if (condition.includes(key)) {
                        weatherIcon = icon;
                        break;
                    }
                }
                
                // 解析温度
                const tempMatch = temp.match(/-?\d+/);
                const tempNum = tempMatch ? parseInt(tempMatch[0]) : 20;
                
                userData.weatherCity = city;
                userData.weatherTemp = tempNum;
                userData.weatherIcon = weatherIcon;
                saveUserData();
                updateDateWeather();
            } catch (e) {

                userData.weatherCity = city;
                userData.weatherTemp = mockTemp;
                userData.weatherIcon = '🌤️';
                saveUserData();
                updateDateWeather();
            }
        }
