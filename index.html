<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
            position: relative;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
        }
        
        .start-screen.hidden {
            display: none;
        }
        
        .start-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8e53);
            color: white;
            border: none;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 3px;
        }
        
        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5);
        }
        
        .end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(10, 10, 26, 0.8);
        }
        
        .end-screen.show {
            display: flex;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8e53);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="start-screen" id="startScreen">
        <button class="start-btn" onclick="startSequence()">开始</button>
    </div>
    
    <div class="end-screen" id="endScreen">
        <button class="restart-btn" onclick="restart()">再来一次</button>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        
        // 独立的状态管理
        const state = {
            textParticles: [],      // 文案粒子
            fireworks: [],            // 烟花粒子
            countdown: null,          // 倒计时状态
            isRunning: false
        };
        
        // 初始化画布
        function resize() {
            const dpr = Math.min(window.devicePixelRatio, 2);
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
        }
        resize();
        window.addEventListener('resize', resize);
        
        // ========== 文案3D粒子系统 ==========
        class Text3DParticle {
            constructor(x, y, color, delay = 0) {
                this.targetX = x;
                this.targetY = y;
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 0;
                this.scale = 0;
                this.delay = delay;
                this.age = 0;
                this.state = 'entering'; // entering, holding, exiting
                
                // 退场飘散参数
                this.exitVx = (Math.random() - 0.5) * 10;
                this.exitVy = (Math.random() - 0.5) * 10 - 3;
                this.exitDecay = 0.08;
            }
            
            update() {
                this.age++;
                
                if (this.state === 'entering') {
                    // 入场缩放动画
                    if (this.age > this.delay) {
                        const progress = Math.min((this.age - this.delay) / 20, 1);
                        this.scale = this.easeOutBack(progress);
                        this.alpha = progress;
                    }
                } else if (this.state === 'exiting') {
                    // 退场飘散
                    this.x += this.exitVx;
                    this.y += this.exitVy;
                    this.alpha -= this.exitDecay;
                    this.scale *= 0.95;
                }
            }
            
            easeOutBack(t) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }
            
            draw() {
                if (this.alpha <= 0) return;
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                const size = 1.5 * this.scale;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            startExit() {
                this.state = 'exiting';
            }
        }
        
        // 获取文字像素
        function getTextPixels(text, fontSize) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            tempCanvas.width = width;
            tempCanvas.height = height;
            
            // 华文细黑
            tempCtx.font = `bold ${fontSize}px "STHeiti", "华文细黑", "Heiti SC", sans-serif`;
            tempCtx.fillStyle = 'white';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            const lineHeight = fontSize * 1.1;
            const totalHeight = lines.length * lineHeight;
            const startY = (height - totalHeight) / 2 + fontSize / 2;
            
            lines.forEach((line, i) => {
                tempCtx.fillText(line, width / 2, startY + i * lineHeight);
            });
            
            const imageData = tempCtx.getImageData(0, 0, width, height);
            const pixels = [];
            const step = 2;
            
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    if (imageData.data[idx + 3] > 128) {
                        pixels.push({ x, y });
                    }
                }
            }
            
            return pixels;
        }
        
        // 创建文案粒子
        function createTextParticles(text, color, fontSize) {
            const pixels = getTextPixels(text, fontSize);
            const particles = [];
            
            pixels.forEach((p, i) => {
                // 随机延迟，营造波浪入场效果
                const delay = Math.random() * 30;
                particles.push(new Text3DParticle(p.x, p.y, color, delay));
            });
            
            return particles;
        }
        
        // 显示文案
        async function showBlessing(text, color, fontSize, holdTime = 2000) {
            // 退场旧文案
            state.textParticles.forEach(p => p.startExit());
            
            // 等待退场完成
            await new Promise(r => setTimeout(r, 400));
            
            // 创建新文案
            state.textParticles = createTextParticles(text, color, fontSize);
            
            // 等待显示
            await new Promise(r => setTimeout(r, holdTime));
        }
        
        // ========== 烟花系统（完全独立） ==========
        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = 0.015;
                this.gravity = 0.08;
            }
            
            update() {
                this.vx *= 0.985;
                this.vy *= 0.985;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            
            draw() {
                if (this.alpha <= 0) return;
                ctx.globalAlpha = this.alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 1.5, this.y - this.vy * 1.5);
                ctx.stroke();
            }
        }
        
        function createFirework(x, y) {
            const colorPalette = [
                ['#ff6b6b', '#ff8e8e', '#ffb3b3'],
                ['#feca57', '#ffd93d', '#ffed4a'],
                ['#48dbfb', '#74e0fc', '#9eeafc'],
                ['#ff9ff3', '#ffb8f5', '#ffd1f7'],
                ['#54a0ff', '#74b9ff', '#a3d1ff'],
                ['#5f27cd', '#7c4dff', '#9b7dff'],
                ['#ff0000', '#ff4d4d', '#ff8080'],
                ['#00ff00', '#4dff4d', '#80ff80'],
                ['#ffff00', '#ffff4d', '#ffff80'],
                ['#ff00ff', '#ff4dff', '#ff80ff'],
                ['#ffa500', '#ffb84d', '#ffcc80'],
                ['#ffc0cb', '#ffd1d9', '#ffe2e8'],
                ['#40e0d0', '#6fe8db', '#9ff0e6'],
                ['#ffd700', '#ffe44d', '#ffed80'],
                ['#ff69b4', '#ff8ec7', '#ffb3da']
            ];
            
            const palette = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            const extendedPalette = [...palette, ...palette, ...palette]; // 扩展为9种
            
            for (let i = 0; i < 90; i++) {
                const color = extendedPalette[Math.floor(Math.random() * extendedPalette.length)];
                state.fireworks.push(new FireworkParticle(x, y, color));
            }
        }
        
        // ========== 倒计时系统（完全独立） ==========
        class CountdownParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1;
                this.scale = 0;
                this.targetScale = 1;
            }
            
            update() {
                this.scale += (this.targetScale - this.scale) * 0.1;
            }
            
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                const size = 2 * this.scale;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function createCountdownParticles(text, color, fontSize) {
            const pixels = getTextPixels(text, fontSize);
            return pixels.map(p => new CountdownParticle(p.x, p.y, color));
        }
        
        // ========== 主渲染循环 ==========
        function render() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // 清空画布
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            // 渲染文案粒子
            for (let i = state.textParticles.length - 1; i >= 0; i--) {
                const p = state.textParticles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0 && p.state === 'exiting') {
                    state.textParticles.splice(i, 1);
                }
            }
            
            // 渲染烟花
            for (let i = state.fireworks.length - 1; i >= 0; i--) {
                const p = state.fireworks[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    state.fireworks.splice(i, 1);
                }
            }
            
            // 限制烟花数量
            if (state.fireworks.length > 500) {
                state.fireworks = state.fireworks.slice(-300);
            }
            
            requestAnimationFrame(render);
        }
        
        // ========== 主流程 ==========
        async function startSequence() {
            startScreen.classList.add('hidden');
            state.isRunning = true;
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            const countdownSize = Math.min(width, height) * 0.4;
            const blessingSize = Math.min(width, height) * 0.16;
            
            // 倒计时
            await showCountdown('3', '#ff0000', countdownSize, 800);
            await showCountdown('2', '#ff0000', countdownSize, 800);
            await showCountdown('1', '#ff0000', countdownSize, 800);
            await showCountdown('❤', '#ff6b9d', countdownSize, 1000);
            
            // 启动烟花
            const fireworkInterval = setInterval(() => {
                createFirework(
                    Math.random() * width,
                    Math.random() * height * 0.6 + height * 0.1
                );
            }, 400);
            
            // 文案（三行显示）
            const blessings = [
                '七夕\n快乐',
                '漫天烟花\n为你\n绽放',
                '愿所有\n相遇\n化作永恒',
                '愿所有\n爱意\n不被辜负',
                '有情人\n终成\n眷属'
            ];
            
            for (const text of blessings) {
                await showBlessing(text, '#ffffff', blessingSize, 1800);
            }
            
            clearInterval(fireworkInterval);
            
            await new Promise(r => setTimeout(r, 500));
            endScreen.classList.add('show');
            state.isRunning = false;
        }
        
        // 显示倒计时
        async function showCountdown(text, color, fontSize, holdTime) {
            state.textParticles = createTextParticles(text, color, fontSize);
            await new Promise(r => setTimeout(r, holdTime));
            state.textParticles.forEach(p => p.startExit());
            await new Promise(r => setTimeout(r, 300));
        }
        
        // 重新开始
        function restart() {
            endScreen.classList.remove('show');
            state.textParticles = [];
            state.fireworks = [];
            state.isRunning = false;
            startScreen.classList.remove('hidden');
        }
        
        // 点击放烟花
        canvas.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });
        
        // 启动
        render();
    </script>
</body>
</html>
